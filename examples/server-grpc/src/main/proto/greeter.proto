syntax = "proto3";

package bootable.example;

option java_multiple_files = true;
option java_package = "com.github.rocketraman.bootable.example.grpc";

// A greeter, with a unary and a server-streaming method.
service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc StreamHellos (HelloRequest) returns (stream HelloReply);
}

message HelloRequest {
  string name = 1;
  int32 count = 2;
}

message HelloReply {
  string message = 1;
}
