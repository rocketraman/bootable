server {
  host-port = ":8001"
}

db {
  jdbc {
    # relative to the working directory, and under build/ so it never lands in the source tree: `./gradlew run`
    # runs in this example's directory, while an IDE run configuration usually runs in the repository root
    path = "build/entries.db"
  }
  pool {
    poolName = entries
    connectionTimeout = 5s
  }
  # migrations come from the default location, classpath:db/migration
  flyway {
    failOnMissingLocations = true
  }
  exposed {
    # fail the start if the migrated schema doesn't match the Exposed tables; WARN only logs the difference
    schemaVerification = FAIL
  }
}
