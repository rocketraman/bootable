server {
  host-port = ":8001"
}

db {
  jdbc {
    # relative to the working directory, and under build/ so it never lands in the source tree: `./gradlew run`
    # runs in this example's directory, while an IDE run configuration usually runs in the repository root
    path = "build/entries.db"
  }
  pool {
    poolName = entries
    connectionTimeout = 5s
  }
  flyway {
    # the application's migrations, and db-scheduler's table, from boot-scheduler-db
    locations = ["classpath:db/migration", "classpath:bootable/db-scheduler/sqlite"]
    failOnMissingLocations = true
  }
  scheduler {
    # well within the 30 second grace period of a Kubernetes pod; db-scheduler's own default is 30 minutes
    shutdownMaxWait = 20s
  }
  exposed {
    # fail the start if the migrated schema doesn't match the Exposed tables; WARN only logs the difference
    schemaVerification = FAIL
  }
}

http {
  client {
    named {
      # the client GET /relay/{name} calls this server back with; a real app's would call another service
      entries {
        baseUrl = "http://localhost:8001/"
        connectTimeout = 2s
        requestTimeout = 10s
        retry {
          maxRetries = 2
        }
      }
    }
  }
}

entries {
  # the entry count, logged by a periodic loop
  report {
    interval = 1m
  }
  # the entry digest, logged by a recurring db-scheduler task
  digest {
    interval = 1m
  }
}

leader {
  kubernetes {
    leaseName = entries-leader
    # skip the election, so this instance leads, as it must outside Kubernetes; in a cluster, set this to false, e.g.
    # with LEADER_KUBERNETES_ASSUMELEADER=false, and grant the pod's service account get, create and update on leases;
    # the election's HTTP client then trusts the API server through the service account's ca.crt, by default
    assumeLeader = true
  }
}

telemetry {
  sdk {
    serviceName = entries
    # with no OTLP endpoint, traces go nowhere, and metrics only to the Prometheus scrape; to send both to an
    # OpenTelemetry collector or Jaeger, set OTEL_EXPORTER_OTLP_ENDPOINT, or:
    # otlp { endpoint = "http://localhost:4318" }
  }
  # ktor {
  #   # serve the scrape on a port of its own, rather than at /metrics on the server
  #   hostPort = ":9001"
  # }
}

health {
  readiness {
    # once shutdown begins, readiness is down for this long before the services stop, so a load balancer stops
    # routing here first; in Kubernetes, a few seconds
    # drainDelay = 5s
  }
  # ktor {
  #   # serve the probes on a port of their own, rather than at /health/live and /health/ready on the server
  #   hostPort = ":9101"
  # }
}
