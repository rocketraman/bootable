name: bootable
title: Bootable
# no version here: the playbook sets it, next for the checkout being built, and the minor release for a release tag
# (docs/site/antora-playbook.yml); this file is the same at every tag, so it can't say which it is
start_page: ROOT:index.adoc
asciidoc:
  attributes:
    # bootable-version, the release the install snippets show, is set per version by docs/site/extensions/versions.js
    bootable-group: com.github.rocketraman.bootable
    metro-version: 1.4.5
    ksp-version: 2.3.14
    inara-version: 0.4.0
    # the versions the gRPC page's protoc setup shows, as gradle/libs.versions.toml has them
    protobuf-version: 4.36.2
    protobuf-plugin-version: 0.10.1
    kotpb-version: 0.2.3
    source-language: kotlin
    # remember the reader's choice in a synced tab set, e.g. their DI, across pages and visits
    tabs-sync-option: ''
    example-caption: false
nav:
- modules/ROOT/nav.adoc
# what Bootable is built on: its approach, the lifecycle, the start order
- modules/concepts/nav.adoc
# every function, in one list, so the sidebar shows one Functions heading
- modules/ROOT/nav-functions.adoc
- modules/examples/nav.adoc
# then the API reference, which the dokka extension adds, and, last, why Bootable, against the alternatives a reader knows
- modules/comparison/nav.adoc
ext:
  # the snippets live in the docs:snippets Gradle projects, where the build compiles them; bring them into the
  # component's examples, so pages can include them with include::ROOT:example$<wiring>/<function>/<file>[tag=...];
  # Metro has a project per function, each into the same examples directory
  collector:
  - scan:
      dir: docs/snippets/vanilla/src/main/kotlin/snippets
      into: modules/ROOT/examples/vanilla
  - scan:
      dir: docs/snippets/kodein/src/main/kotlin/snippets
      into: modules/ROOT/examples/kodein
  - scan:
      dir: docs/snippets/koin/src/main/kotlin/snippets
      into: modules/ROOT/examples/koin
  - scan:
      dir: docs/snippets/inara/src/main/kotlin/snippets
      into: modules/ROOT/examples/inara
  - scan:
      dir: docs/snippets/metro/database/src/main/kotlin/snippets
      into: modules/ROOT/examples/metro
  - scan:
      dir: docs/snippets/metro/grpc/src/main/kotlin/snippets
      into: modules/ROOT/examples/metro
  - scan:
      dir: docs/snippets/metro/http/src/main/kotlin/snippets
      into: modules/ROOT/examples/metro
  - scan:
      dir: docs/snippets/metro/telemetry/src/main/kotlin/snippets
      into: modules/ROOT/examples/metro
  - scan:
      dir: docs/snippets/metro/concepts/src/main/kotlin/snippets
      into: modules/ROOT/examples/metro
  - scan:
      dir: docs/snippets/metro/configuration/src/main/kotlin/snippets
      into: modules/ROOT/examples/metro
  - scan:
      dir: docs/snippets/metro/background/src/main/kotlin/snippets
      into: modules/ROOT/examples/metro
  - scan:
      dir: docs/snippets/metro/testing/src/main/kotlin/snippets
      into: modules/ROOT/examples/metro
  - scan:
      dir: docs/snippets/common/src/main/kotlin/snippets
      into: modules/ROOT/examples/common
  - scan:
      dir: docs/snippets/common/src/main/resources
      into: modules/ROOT/examples/common
