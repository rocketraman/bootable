http {
  client {
    default {
      requestTimeout = 7s
      headers {
        X-Default = default
      }
    }
    named {
      github {
        baseUrl = "https://api.github.test/v3/"
        headers {
          Accept = "application/vnd.github+json"
        }
        retry {
          maxRetries = 2
          initialDelay = 1ms
        }
      }
    }
  }
}
