db {
  jdbc {
    path = "build/scheduler-wiring-test.db"
  }
  pool {
    poolName = scheduler-wiring-test
  }
  flyway {
    locations = ["classpath:bootable/db-scheduler/sqlite"]
  }
  scheduler {
    threads = 3
    pollingInterval = 100ms
    immediateExecution = true
    shutdownMaxWait = 5s
    schedulerName = wiring-test
  }
}
