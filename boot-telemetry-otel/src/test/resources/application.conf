env {
  environment = test
}

telemetry {
  sdk {
    serviceName = wiring-test
    serviceVersion = "1.2.3"
    resourceAttributes {
      "service.namespace" = bootable
    }
    otlp {
      # nothing listens in the wiring tests; OpenTelemetryServiceTest exports to a collector of its own
      endpoint = "http://localhost:4318"
      headers {
        api-key = test-key
      }
      compression = true
      timeout = 2s
    }
    traces {
      sampleRatio = 0.5
    }
    metrics {
      interval = 30s
      runtime = false
    }
    registerGlobal = false
  }
}
