leader {
  kubernetes {
    leaseName = "wiring-test-leader"
    namespace = "apps"
    identity = "pod-1"
    leaseDuration = 30s
    renewDeadline = 20s
    # outside a cluster, as when running locally
    assumeLeader = true
  }
}

http {
  client {
    named {
      # the client leader election calls the API server with
      kubernetes {
        requestTimeout = 5s
      }
    }
  }
}
