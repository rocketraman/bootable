telemetry {
  sdk {
    serviceName = scheduler-db-otel-test
    metrics {
      runtime = false
    }
    registerGlobal = false
  }
}

db {
  jdbc {
    path = "build/scheduler-tracing-test.db"
  }
  pool {
    poolName = scheduler-tracing-test
  }
  flyway {
    locations = ["classpath:bootable/db-scheduler/sqlite"]
  }
  scheduler {
    pollingInterval = 100ms
    immediateExecution = true
    shutdownMaxWait = 5s
  }
}
