db {
  jdbc {
    path = "build/exposed-wiring-test.db"
  }
  pool {
    poolName = exposed-wiring-test
  }
  flyway {
    failOnMissingLocations = true
  }
  exposed {
    defaultIsolationLevel = SERIALIZABLE
    defaultMaxAttempts = 1
    warnLongQueriesDuration = 2s
    schemaVerification = FAIL
  }
}
